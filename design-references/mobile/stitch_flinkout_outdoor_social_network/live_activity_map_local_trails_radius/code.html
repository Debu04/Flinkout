<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .pulse-dot {
            position: relative;
            width: 16px;
            height: 16px;
            background: #395f94;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(57, 95, 148, 0.5);
        }
        
        .pulse-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(57, 95, 148, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .map-glass {
            background: rgba(249, 249, 248, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .heatmap-teal {
            background: radial-gradient(circle, rgba(173, 206, 195, 0.6) 0%, rgba(173, 206, 195, 0) 70%);
        }

        .heatmap-orange {
            background: radial-gradient(circle, rgba(255, 181, 157, 0.6) 0%, rgba(255, 181, 157, 0) 70%);
        }

            box-shadow: 0 8px 24px rgba(22, 52, 45, 0.25);
